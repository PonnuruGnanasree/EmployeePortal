<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Gantec – Employee Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=2" />
  <link rel="stylesheet" href="css/branding.css" />
  <style>
    .splash-main {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #1d3461; /* Dark blue background as per image */
      overflow: hidden;
      position: relative;
    }

    .splash-content {
      z-index: 10;
      animation: reveal 1s cubic-bezier(0.19, 1, 0.22, 1);
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo-text-big {
      font-size: 5rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #000000; /* Black GANTEC as per image */
      margin: 0;
      line-height: 1;
    }

    .portal-text-big {
      font-size: 3.5rem;
      font-weight: 800;
      color: #7c3aed; /* Purple/Blue gradient feel */
      background: linear-gradient(to right, #4f46e5, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: -5px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .splash-subtitle {
      font-size: 1.1rem;
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 20px;
      opacity: 0.8;
    }

    .underline-accent {
      width: 80px;
      height: 4px;
      background: linear-gradient(to right, #4f46e5, #7c3aed);
      margin-top: 40px;
      border-radius: 2px;
    }

    .loading-line {
      width: 600px;
      max-width: 80%;
      height: 4px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    .loading-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: linear-gradient(to right, #1d3461, #4f46e5, #7c3aed);
      width: 0;
      animation: loadProgress 8s linear forwards;
    }

    @keyframes loadProgress {
      from { width: 0; }
      to { width: 100%; }
    }

    .redirect-msg {
      margin-bottom: 20px;
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <div class="splash-main">
    <div class="splash-content">
      <h1 class="logo-text-big">GANTEC</h1>
      <h2 class="portal-text-big">Employee Portal</h2>
      <p class="splash-subtitle">Empowering Innovation & People</p>
      <p class="redirect-msg">Please wait while we load your documents and settings</p>
      <div class="loading-line">
        <div class="loading-fill"></div>
      </div>
    </div>
  </div>

  <script>
    // After 8 seconds, redirect to the login page
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 8000);
  </script>
</body>

</html>
