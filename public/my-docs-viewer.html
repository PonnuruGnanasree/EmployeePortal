<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Viewer – Gantec Employee Portal</title>
  <meta name="description"
    content="View and browse all your PDF documents organized by folder with Gantec Employee Portal." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=40" />
  <!-- Rendering Libraries for Local Documents -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
</head>

<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-brand">
      <a href="home.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
        <span class="nav-logo">📂</span>
        <span class="nav-title">Gantec Employee Portal</span>
      </a>
    </div>
    <div class="nav-links">
      <a href="home.html" class="nav-link" id="nav-home">Home</a>
      <div class="nav-dropdown">
        <a href="#" class="nav-link active" id="nav-documents" aria-haspopup="true" aria-expanded="false">Training
          Resources <span class="dropdown-arrow">▼</span></a>
        <div class="dropdown-menu left">
          <a href="viewer.html" class="dropdown-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-xs">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            View and Upload Resources
          </a>
        </div>
      </div>
      <a href="document-locker.html" class="nav-link" id="nav-mydocs" style="display:flex;align-items:center;gap:5px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">
          <rect x="5" y="2" width="14" height="20" rx="2" />
          <line x1="9" y1="7" x2="15" y2="7" />
          <line x1="9" y1="11" x2="15" y2="11" />
          <line x1="9" y1="15" x2="12" y2="15" />
        </svg>
        Document Locker
      </a>
      <div id="user-profile-section"></div>
    </div>
  </nav>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- PDF Modal -->
  <div class="modal-overlay hidden" id="pdf-modal"
    style="backdrop-filter: blur(16px); background: rgba(0,0,0,0.45); z-index: 9000;">
    <div class="pdf-modal">
      <div class="modal-header">
        <div class="modal-file-info">
          <span class="modal-icon" id="modal-icon">📄</span>
          <span class="modal-filename" id="modal-filename">document.ext</span>
        </div>
        <div class="modal-actions">
          <a id="modal-download" class="btn-modal-download" download title="Download File">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
              style="width: 18px; height: 18px;">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Download
          </a>
          <button class="modal-close-btn" id="modal-close" title="Close Viewer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
              style="width: 18px; height: 18px;">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
      </div>
      <div class="modal-body">
        <div id="preview-fallback" class="preview-fallback hidden"></div>
        <iframe id="pdf-iframe" src="" title="File Viewer"></iframe>
      </div>
    </div>
  </div>

  <!-- Viewer Layout -->
  <div class="viewer-layout">
    <!-- Sidebar -->
    <aside class="sidebar glass-card" id="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-sm">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
          </svg>
          Folders
        </h2>
        <a href="my-docs-uploader.html" class="btn btn-primary btn-sm" title="Upload new document">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-xs">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          New
        </a>
      </div>

      <!-- All Documents toggle -->
      <div class="sidebar-item active" data-folder="__all__" id="folder-all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-xs">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
          <line x1="8" y1="21" x2="16" y2="21" />
          <line x1="12" y1="17" x2="12" y2="21" />
        </svg>
        <span>All Documents</span>
        <span class="folder-count" id="count-all">0</span>
      </div>

      <div class="sidebar-folders" id="sidebar-folders">
        <!-- Dynamically populated -->
      </div>
    </aside>

    <!-- Main Content -->
    <main class="viewer-main">
      <!-- Toolbar -->
      <div class="viewer-toolbar">
        <div class="toolbar-left">
          <h1 class="viewer-heading" id="viewer-heading">All Documents</h1>
          <span class="doc-count-badge" id="doc-count-badge">0 files</span>
        </div>
        <div class="toolbar-right">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="search" id="search-input" class="search-input" placeholder="Search documents…"
              autocomplete="off" />
          </div>
          <div class="view-toggle">
            <button class="view-btn active" id="grid-btn" title="Grid view">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
              </svg>
            </button>
            <button class="view-btn" id="list-btn" title="List view">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="8" y1="6" x2="21" y2="6" />
                <line x1="8" y1="12" x2="21" y2="12" />
                <line x1="8" y1="18" x2="21" y2="18" />
                <line x1="3" y1="6" x2="3.01" y2="6" />
                <line x1="3" y1="12" x2="3.01" y2="12" />
                <line x1="3" y1="18" x2="3.01" y2="18" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Document Grid/List -->
      <div class="docs-container" id="docs-container">
        <div class="docs-grid" id="docs-grid">
          <!-- Document cards rendered by JS -->
        </div>
        <!-- Empty state -->
        <div class="empty-state hidden" id="empty-state">
          <div class="empty-icon">📁</div>
          <h3>No documents found</h3>
          <p>Upload or View the files to get started.</p>
          <a href="my-docs-uploader.html" class="btn btn-primary">Upload Document</a>
        </div>
      </div>
    </main>
  </div>

  <!-- Custom Delete Confirm Modal -->
  <div class="confirm-modal-overlay" id="delete-confirm-modal">
    <div class="confirm-dialog">
            <div class="confirm-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:44px;height:44px;">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
        </svg>
      </div>
      <div class="confirm-body">
        <h3>Delete File?</h3>
        <p id="delete-confirm-msg">Should I need to delete this?</p>
      </div>
      <div class="confirm-footer">
        <button id="delete-confirm-ok-btn" class="btn-confirm btn-confirm-delete">Yes, Delete</button>
        <button id="delete-confirm-cancel-btn" class="btn-confirm btn-confirm-cancel">No, Keep it</button>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=40"></script>
  <script src="js/my-docs-viewer.js?v=40"></script>
</body>

</html>
