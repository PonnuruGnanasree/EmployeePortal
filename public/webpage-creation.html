<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Webpage Builder | Gantec</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;400;600;700;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary: #1d3461;
      --accent: #e05a2b;
      --success: #10b981;
      --bg: #f0f4f8;
      --card-bg: rgba(255, 255, 255, 0.8);
      --border: rgba(29, 52, 97, 0.1);
      --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    body,
    html {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--primary);
      height: 100%;
      overflow: hidden;
    }

    /* --- Animations --- */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideIn {
      from {
        transform: translateX(50px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }

      100% {
        transform: scale(1);
      }
    }

    .view {
      display: none;
      min-height: 100vh;
      width: 100%;
    }

    .view.active {
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.6s ease-out;
    }

    /* --- Builder UI --- */
    #builder-view {
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      padding: 40px;
    }

    .builder-container {
      max-width: 900px;
      width: 100%;
      text-align: center;
    }

    .builder-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid white;
      border-radius: 32px;
      padding: 60px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
    }

    .main-title {
      font-family: 'Outfit', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      margin-bottom: 40px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-group {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 120px;
    }

    .btn-main {
      padding: 14px 32px;
      border-radius: 16px;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
    }

    .btn-welcome {
      background: #f1f5f9;
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .btn-home {
      background: #f1f5f9;
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .btn-main:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
    }

    .btn-main:active {
      transform: scale(0.95);
    }

    .btn-generate {
      background: var(--success);
      color: white;
      font-size: 1.1rem;
      padding: 16px 48px;
      margin-top: 40px;
      margin-left: auto;
      margin-right: auto;
      display: none;
      justify-content: center;
      align-items: center;
      animation: pulse 2s infinite;
      border: none;
      border-radius: 20px;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 15px 35px rgba(16, 185, 129, 0.2);
    }

    /* --- Modals & Forms --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(29, 52, 97, 0.4);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      border-radius: 28px;
      padding: 40px;
      overflow-y: auto;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
    }

    .form-group {
      margin-bottom: 24px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #64748b;
    }

    .form-input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      font-family: inherit;
      font-size: 1rem;
      box-sizing: border-box;
      transition: all 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(29, 52, 97, 0.05);
    }

    .dynamic-fields {
      margin-top: 20px;
      border-top: 1px solid #e2e8f0;
      padding-top: 20px;
    }

    .qa-pair {
      background: #f8fafc;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
      animation: fadeIn 0.4s ease-out;
    }

    .qa-header {
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 12px;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .modal-footer {
      display: flex;
      gap: 16px;
      margin-top: 32px;
    }

    .btn-save {
      flex: 2;
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background: #f1f5f9;
      color: #64748b;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* --- Generated Website Styles --- */
    #generated-view {
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay-glass {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .btn-back-gen {
      position: fixed;
      top: 30px;
      left: 30px;
      background: #1d3461;
      border: none;
      color: white;
      padding: 12px 28px;
      border-radius: 100px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      transition: all 0.3s ease;
      z-index: 3000;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.85rem;
      box-shadow: 0 4px 15px rgba(29, 52, 97, 0.4);
    }

    .btn-back-gen:hover {
      background: #142a4f;
      transform: translateX(-4px);
      box-shadow: 0 6px 20px rgba(29, 52, 97, 0.5);
    }

    .welcome-screen,
    .nav-screen,
    .quiz-intro-screen,
    .quiz-screen,
    .completion-screen {
      max-width: 800px;
      width: 100%;
      text-align: center;
      color: white;
      animation: fadeIn 0.8s ease-out;
      display: none;
    }

    .welcome-screen.active,
    .nav-screen.active,
    .quiz-intro-screen.active,
    .quiz-screen.active,
    .completion-screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }

    .gen-title {
      font-family: 'Outfit', sans-serif;
      font-size: 4rem;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .gen-subtitle {
      font-size: 1.5rem;
      opacity: 0.9;
      margin-bottom: 24px;
    }

    .gen-desc {
      font-size: 1.2rem;
      line-height: 1.6;
      opacity: 0.8;
      margin-bottom: 40px;
    }

    .btn-gen {
      padding: 14px 40px;
      border-radius: 50px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .timer-container {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 30px;
    }

    .timer-svg {
      transform: rotate(-90deg);
      width: 100px;
      height: 100px;
    }

    .timer-circle {
      fill: none;
      stroke-width: 8;
      stroke: white;
      opacity: 0.2;
    }

    .timer-progress {
      fill: none;
      stroke-width: 8;
      stroke: var(--accent);
      stroke-dasharray: 283;
      stroke-dashoffset: 0;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }

    .timer-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
    }

    .quiz-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 32px;
      padding: 60px;
      margin-top: 40px;
    }

    .q-num {
      color: var(--accent);
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: block;
    }

    .q-text {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 40px;
    }

    .answer-box {
      background: rgba(16, 185, 129, 0.1);
      border: 2px solid rgba(16, 185, 129, 0.3);
      color: var(--primary);
      padding: 30px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 800;
      margin-top: 20px;
      display: none;
      animation: slideIn 0.5s ease-out;
    }

    .timer-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
      margin-bottom: 30px;
    }

    .btn-timer {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-timer:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* --- Dropdown --- */
    .dropdown {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: white;
      border-radius: 16px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      width: 200px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 100;
    }

    .dropdown-menu.active {
      display: flex;
    }

    .dropdown-item {
      padding: 14px 20px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }

    .dropdown-item:hover {
      background: #f1f5f9;
      color: var(--accent);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main-title {
        font-size: 2rem;
      }

      .btn-group {
        flex-direction: column;
      }

      .gen-title {
        font-size: 2.5rem;
      }

      .quiz-card {
        padding: 30px;
      }

      .q-text {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <!-- VIEW 1: THE BUILDER -->
  <div id="builder-view" class="view active">
    <div class="builder-container">
      <div class="builder-card">
        <h1 class="main-title">Let's Create Your Own Website</h1>
        <div class="btn-group">
          <button class="btn-main btn-welcome" onclick="openModal('welcome')">
            Welcome Page
          </button>

          <div class="dropdown">
            <button class="btn-main btn-home" id="home-btn" onclick="toggleDropdown()">
              Home Page
            </button>
            <div class="dropdown-menu" id="home-dropdown">
              <div class="dropdown-item" onclick="openModal('tech')">Tech Section</div>
              <div class="dropdown-item" onclick="openModal('fun')">Fun Activity</div>
            </div>
          </div>
        </div>

        <button id="btn-generate-main" class="btn-main btn-generate" onclick="generateWebsite()">
          Generate Website 🚀
        </button>
      </div>
    </div>
  </div>

  <!-- VIEW 2: THE GENERATED WEBSITE -->
  <div id="generated-view" class="view">
    <button class="btn-back-gen" onclick="goBack()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back
    </button>

    <!-- Welcome Screen -->
    <div id="screen-welcome" class="screen welcome-screen active">
      <h1 id="gen-welcome-title" class="gen-title"></h1>
      <h2 id="gen-welcome-subtitle" class="gen-subtitle"></h2>
      <p id="gen-welcome-desc" class="gen-desc"></p>
      <button id="gen-welcome-btn" class="btn-gen" onclick="nextScreen('nav')">Start Experience</button>
    </div>

    <!-- Navigation Screen -->
    <div id="screen-nav" class="screen nav-screen">
      <h1 class="gen-title">Let's Begin</h1>
      <div class="btn-group" style="margin-top: 40px;">
        <button class="btn-gen" style="min-width: 130px; text-align: center;" onclick="startQuiz('fun')">Fun
          Activity</button>
        <button class="btn-gen" style="background:var(--primary); min-width: 130px; text-align: center;"
          onclick="startQuiz('tech')">Technical</button>

      </div>
    </div>

    <!-- Quiz Intro Screen -->
    <div id="screen-quiz-intro" class="screen quiz-intro-screen">
      <h1 id="quiz-intro-title" class="gen-title" style="margin-bottom: 40px;"></h1>
      <div id="quiz-intro-content"
        style="margin-bottom: 40px; max-width: 600px; font-size: 1.2rem; line-height: 1.6; background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px);">
        <!-- Dynamic text or image content goes here -->
      </div>
      <button class="btn-gen" style="font-size: 1.2rem; padding: 16px 48px; border-radius: 100px;"
        onclick="proceedToQuiz()">Let's Start</button>
    </div>

    <!-- Quiz Screen -->
    <div id="screen-quiz" class="screen quiz-screen">
      <div class="timer-container">
        <svg class="timer-svg">
          <circle class="timer-circle" cx="50" cy="50" r="45"></circle>
          <circle id="timer-progress" class="timer-progress" cx="50" cy="50" r="45"></circle>
        </svg>
        <div id="timer-text" class="timer-text">20</div>
      </div>

      <div class="timer-controls">
        <button class="btn-timer" onclick="pauseTimer()">Pause</button>
        <button class="btn-timer" onclick="resetTimer(); startTimer();">Restart</button>
      </div>



      <div class="quiz-card">
        <span id="quiz-num" class="q-num">Question 1</span>
        <h2 id="quiz-text" class="q-text">Loading question...</h2>

        <div style="margin-bottom: 20px; display: flex; justify-content: center;">
          <button id="btn-show-answer" class="btn-gen" style="background:var(--primary);" onclick="showAnswer()">Show
            Answer</button>
        </div>

        <div id="answer-box" class="answer-box">
          The answer is: <span id="answer-text"></span>
        </div>

        <div style="margin-top: 20px; display: flex; justify-content: center;">
          <button id="btn-next-q" class="btn-gen" style="display:none;" onclick="nextQuestion()">Next
            Question</button>
        </div>
      </div>
    </div>

    <!-- Completion Screen -->
    <div id="screen-completion" class="screen completion-screen">
      <h1 class="gen-title">🎉 Completed!!</h1>
      <p class="gen-desc">You have successfully finished this section.</p>
      <div class="btn-group" style="justify-content: center; margin-top: 20px;">
        <button class="btn-gen" style="background:var(--primary);" onclick="nextScreen('nav')">Back to Menu</button>
      </div>
    </div>

  </div>
  </div>

  <!-- MODALS -->
  <!-- Welcome Page Modal -->
  <div id="modal-welcome" class="modal-overlay">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
        <h2 class="main-title" style="font-size: 2rem; margin: 0;">Welcome Page Details</h2>
        <button type="button" onclick="closeModals()"
          style="background: #f1f5f9; border: none; color: #64748b; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="w-title" class="form-input" placeholder="e.g. Welcome to the Grand Quiz">
      </div>
      <div class="form-group">
        <label>Subtitle</label>
        <input type="text" id="w-subtitle" class="form-input" placeholder="e.g. Test your knowledge in style">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="w-desc" class="form-input" style="height: 100px;"
          placeholder="What is this event about?"></textarea>
      </div>
      <div class="form-group">
        <label>Background Image</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="text" id="w-bg" class="form-input" placeholder="Background image path will appear here" readonly
            style="flex:1; background:#f8fafc; font-size: 0.85rem; padding: 8px 12px;">
          <button type="button"
            style="padding:8px 18px; border-radius:100px; border:none; background:var(--primary); color:white; font-weight:700; font-size:0.78rem; cursor:pointer; flex-shrink:0; white-space:nowrap;"
            onclick="triggerUpload(this)">📁 Upload</button>
          <input type="file" style="display:none;" onchange="handleQAFileUpload(this, 'bg')">
        </div>
      </div>
      <div class="form-group">
        <label>Button Text</label>
        <input type="text" id="w-btn" class="form-input" placeholder="e.g. Get Started">
      </div>
      <!-- <div class="form-group">
        <label>Text Colour (Optional)</label>
        <input type="text" id="w-color" class="form-input" placeholder="e.g. black, #ffffff, red" title="Pick text colour">
      </div> -->
      <div class="modal-footer">
        <button class="btn-save" style="width: 100%;" onclick="saveWelcome()">Save Details</button>
      </div>
    </div>
  </div>

  
  <div id="modal-content" class="modal-overlay">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
        <h2 id="content-modal-title" class="main-title" style="font-size: 2rem; margin: 0;">Section Setup</h2>
        <button type="button" onclick="closeModals()"
          style="background: #f1f5f9; border: none; color: #64748b; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="form-group">
        <label>Section Title</label>
        <input type="text" id="c-title" class="form-input" placeholder="e.g. Technology Trends">
      </div>
      <div class="form-group">
        <label>Sub Title</label>
        <input type="text" id="c-subtitle" class="form-input" placeholder="e.g. A quick knowledge check">
      </div>
      <div class="form-group">
        <label>Background Image</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="text" id="c-bg" class="form-input" placeholder="Background image path will appear here" readonly
            style="flex:1; background:#f8fafc; font-size: 0.85rem; padding: 8px 12px;">
          <button type="button"
            style="padding:8px 18px; border-radius:100px; border:none; background:var(--primary); color:white; font-weight:700; font-size:0.78rem; cursor:pointer; flex-shrink:0; white-space:nowrap;"
            onclick="triggerUpload(this)">📁 Upload</button>
          <input type="file" style="display:none;" onchange="handleQAFileUpload(this, 'bg')">
        </div>
      </div>
      <!-- Content Type Toggle -->
      <div class="form-group" style="text-align: center;">
        <label style="display: block; margin-bottom: 15px; text-align: center;">Content Type</label>
        <div
          style="display: inline-flex; background: #f1f5f9; padding: 4px; border-radius: 100px; border: 1px solid #e2e8f0; margin-bottom: 20px;">
          <button type="button" id="c-toggle-text" onclick="setSectionContentType('text')"
            style="padding: 10px 30px; border-radius: 100px; border: none; font-weight: 700; cursor: pointer; transition: all 0.3s; background: var(--primary); color: white;">
            Text
          </button>
          <button type="button" id="c-toggle-image" onclick="setSectionContentType('image')"
            style="padding: 10px 30px; border-radius: 100px; border: none; font-weight: 700; cursor: pointer; transition: all 0.3s; background: transparent; color: #64748b;">
            Image
          </button>
        </div>
        <input type="hidden" name="c-content-type" id="c-type-val" value="text">
      </div>
      <!-- Intro Content -->
      <div id="c-text-group" style="display:none;">
        <textarea id="c-text" class="form-input" style="height: 60px; margin-bottom: 15px;"
          placeholder="Optional: Enter section intro text..."></textarea>
      </div>
      <div id="c-image-group" style="display:none; margin-bottom:15px;">
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="text" id="c-image" class="form-input" placeholder="Image path will appear here" readonly
            style="flex:1; background:#f8fafc; font-size: 0.85rem; padding: 8px 12px;">
          <button type="button"
            style="padding:8px 18px; border-radius:100px; border:none; background:var(--primary); color:white; font-weight:700; font-size:0.78rem; cursor:pointer; flex-shrink:0; white-space:nowrap;"
            onclick="triggerUpload(this)">📁 Upload</button>
          <input type="file" style="display:none;" onchange="handleQAFileUpload(this, 'intro')">
        </div>
      </div>
      <div class="form-group">
        <label>Number of Questions</label>
        <input type="number" id="c-count" class="form-input" min="0" oninput="generateQAFields(this.value)"
          placeholder="Enter question count">
      </div>

      <div id="dynamic-qa-fields" class="dynamic-fields">
        <!-- Dynamic fields appear here -->
      </div>

      <div class="modal-footer">
        <button class="btn-save" style="width: 100%;" onclick="saveContent()">Save Section</button>
      </div>
    </div>
  </div>

  <script>
    // --- STATE MANAGEMENT ---
    let builderData = {
      welcome: null,
      tech: null,
      fun: null
    };

    let activeSectionType = ''; // 'tech' or 'fun'
    let currentQuiz = {
      type: '',
      questions: [],
      index: 0,
      timer: null,
      timeLeft: 20
    };

    // Load from local storage if exists
    const saved = localStorage.getItem('gantec_builder_data');
    if (saved) {
      builderData = JSON.parse(saved);
      checkReadyToGenerate();
    }

    // --- BUILDER LOGIC ---
    function openModal(type) {
      closeModals();
      if (type === 'welcome') {
        const modal = document.getElementById('modal-welcome');
        modal.classList.add('active');
        if (builderData.welcome) {
          document.getElementById('w-title').value = builderData.welcome.title;
          document.getElementById('w-subtitle').value = builderData.welcome.subtitle;
          document.getElementById('w-desc').value = builderData.welcome.desc;
          document.getElementById('w-bg').value = builderData.welcome.bg;
          document.getElementById('w-btn').value = builderData.welcome.btn;
          document.getElementById('w-color').value = builderData.welcome.color || '';
        }
      } else {
        activeSectionType = type;
        const modal = document.getElementById('modal-content');
        document.getElementById('content-modal-title').textContent = type === 'tech' ? 'Tech Section Setup' : 'Fun Activity Setup';
        modal.classList.add('active');

        const data = builderData[type];
        if (data) {
          document.getElementById('c-title').value = data.title;
          document.getElementById('c-subtitle').value = data.subtitle || '';
          document.getElementById('c-bg').value = data.bg;
          // Set content type and populate appropriate field
          setSectionContentType(data.contentType || 'text');
          if (data.contentType === 'image') {
            document.getElementById('c-image').value = data.content || '';
          } else {
            document.getElementById('c-text').value = data.content || '';
          }
          document.getElementById('c-count').value = data.questions ? data.questions.length : '';
          generateQAFields(data.questions ? data.questions.length : 0, data.questions || []);
        } else {
          // Reset fields for new section
          document.getElementById('c-title').value = '';
          document.getElementById('c-subtitle').value = '';
          document.getElementById('c-bg').value = '';
          document.getElementById('c-count').value = '';
          document.getElementById('dynamic-qa-fields').innerHTML = '';
          // reset content type to text and clear fields
          setSectionContentType('text');
          document.getElementById('c-text').value = '';
          document.getElementById('c-image').value = '';
        }
      }
    }

    function closeModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
      document.getElementById('home-dropdown').classList.remove('active');
    }

    function toggleDropdown() {
      document.getElementById('home-dropdown').classList.toggle('active');
    }

    function generateQAFields(count, existingData = []) {
      const container = document.getElementById('dynamic-qa-fields');
      container.innerHTML = '';
      count = parseInt(count);
      if (isNaN(count) || count < 0) return;

      const type = document.getElementById('c-type-val').value;

      for (let i = 1; i <= count; i++) {
        const qVal = existingData[i - 1] ? existingData[i - 1].q : '';
        const aVal = existingData[i - 1] ? existingData[i - 1].a : '';

        const div = document.createElement('div');
        div.className = 'qa-pair';
        div.style.background = '#fff';
        div.style.padding = '12px 16px';
        div.style.borderRadius = '12px';
        div.style.border = '1px solid #e2e8f0';
        div.style.marginBottom = '12px';

        div.innerHTML = `
          <div class="qa-header" style="font-weight:800; color:var(--primary); margin-bottom:10px; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.5px;">Question ${i}</div>
          <div class="form-group" style="margin-bottom:10px;">
            <label style="font-size: 0.75rem; margin-bottom: 4px;">${type === 'text' ? 'Question Text' : 'Question Image'}</label>
            ${type === 'text' ? `
              <input type="text" class="form-input q-input" value="${qVal}" placeholder="Enter question text" style="padding: 8px 12px; font-size: 0.85rem;">
            ` : `
              <div style="display:flex; gap:8px; align-items:center;">
                <input type="text" class="form-input q-input" value="${qVal}" placeholder="Image path will appear here" readonly style="flex:1; background:#f8fafc; font-size: 0.8rem; padding: 6px 10px;">
                <button type="button" style="padding:7px 16px; border-radius:100px; border:none; background:var(--primary); color:white; font-weight:700; font-size:0.75rem; cursor:pointer; flex-shrink:0; white-space:nowrap;" onclick="triggerUpload(this)">📁 Upload</button>
                <input type="file" style="display:none;" onchange="handleQAFileUpload(this, 'q')">
              </div>
            `}
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label style="font-size: 0.75rem; margin-bottom: 4px;">${type === 'text' ? 'Answer Text' : 'Answer Image'}</label>
            ${type === 'text' ? `
              <input type="text" class="form-input a-input" value="${aVal}" placeholder="Enter correct answer" style="padding: 8px 12px; font-size: 0.85rem;">
            ` : `
              <div style="display:flex; gap:8px; align-items:center;">
                <input type="text" class="form-input a-input" value="${aVal}" placeholder="Image path will appear here" readonly style="flex:1; background:#f8fafc; font-size: 0.8rem; padding: 6px 10px;">
                <button type="button" style="padding:7px 16px; border-radius:100px; border:none; background:var(--primary); color:white; font-weight:700; font-size:0.75rem; cursor:pointer; flex-shrink:0; white-space:nowrap;" onclick="triggerUpload(this)">📁 Upload</button>
                <input type="file" style="display:none;" onchange="handleQAFileUpload(this, 'a')">
              </div>
            `}
          </div>
        `;
        container.appendChild(div);
      }
    }

    function triggerUpload(btn) {
      btn.nextElementSibling.click();
    }

    async function handleQAFileUpload(input, fieldType) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      const displayInput = input.parentElement.querySelector('input[type="text"]');
      const btn = input.parentElement.querySelector('button');

      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = '...';

      try {
        const formData = new FormData();
        formData.append('folder', 'Webpage Builder');
        formData.append('file', file);

        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Upload failed');

        const fileUrl = getFileUrl('Webpage Builder', data.filename);
        displayInput.value = fileUrl;
        btn.textContent = '✅ Done';
        btn.style.background = '#22c55e';
      } catch (err) {
        alert('Upload failed: ' + err.message);
        btn.textContent = '❌ Failed';
        btn.style.background = '#ef4444';
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          btn.textContent = originalText;
          btn.style.background = '';
        }, 2000);
      }
    }

    function saveWelcome() {
      builderData.welcome = {
        title: document.getElementById('w-title').value || 'Gantec Interactive Portal',
        subtitle: document.getElementById('w-subtitle').value || 'The ultimate employee experience',
        desc: document.getElementById('w-desc').value || 'Join us for a journey of learning and fun.',
        bg: document.getElementById('w-bg').value || 'https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1920&q=80',
        btn: document.getElementById('w-btn').value || 'Start Now',
        color: document.getElementById('w-color').value || '#ffffff'
      };
      persist();
      closeModals();
    }

    function saveContent() {
      const qInputs = document.querySelectorAll('.q-input');
      const aInputs = document.querySelectorAll('.a-input');
      const questions = [];

      qInputs.forEach((q, index) => {
        questions.push({
          q: q.value,
          a: aInputs[index].value
        });
      });

      // Determine content type and value
      const contentType = document.getElementById('c-type-val').value;
      let contentValue = '';
      if (contentType === 'text') {
        contentValue = document.getElementById('c-text').value;
      } else {
        contentValue = document.getElementById('c-image').value;
      }

      builderData[activeSectionType] = {
        title: document.getElementById('c-title').value || 'Interactive Quiz',
        subtitle: document.getElementById('c-subtitle').value || '',
        bg: document.getElementById('c-bg').value || 'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1920&q=80',
        contentType: contentType,
        content: contentValue,
        questions: questions
      };
      persist();
      closeModals();
    }

    function persist() {
      localStorage.setItem('gantec_builder_data', JSON.stringify(builderData));
      checkReadyToGenerate();
    }

    function checkReadyToGenerate() {
      if (builderData.welcome && builderData.tech && builderData.fun) {
        document.getElementById('btn-generate-main').style.display = 'flex';
      }
    }

    // --- GENERATION ENGINE ---
    function setSectionContentType(type) {
      const textBtn = document.getElementById('c-toggle-text');
      const imageBtn = document.getElementById('c-toggle-image');
      const typeVal = document.getElementById('c-type-val');

      typeVal.value = type;

      if (type === 'text') {
        textBtn.style.background = 'var(--primary)';
        textBtn.style.color = 'white';
        imageBtn.style.background = 'transparent';
        imageBtn.style.color = '#64748b';
      } else {
        imageBtn.style.background = 'var(--primary)';
        imageBtn.style.color = 'white';
        textBtn.style.background = 'transparent';
        textBtn.style.color = '#64748b';
      }

      // Update existing questions placeholders/labels
      const count = document.getElementById('c-count').value;
      if (count) {
        const qInputs = document.querySelectorAll('.q-input');
        const aInputs = document.querySelectorAll('.a-input');
        const existing = [];
        qInputs.forEach((q, idx) => {
          existing.push({ q: q.value, a: aInputs[idx].value });
        });
        generateQAFields(count, existing);
      }
    }

    // Deprecated old toggle function
    function toggleContentVisibility() {
      const typeVal = document.getElementById('c-type-val');
      setSectionContentType(typeVal.value);
    }

    // --- GENERATION ENGINE ---
    function generateWebsite() {
      document.getElementById('builder-view').classList.remove('active');
      document.getElementById('generated-view').classList.add('active');

      // Init Welcome Screen
      const w = builderData.welcome;
      document.getElementById('gen-welcome-title').textContent = w.title;
      document.getElementById('gen-welcome-subtitle').textContent = w.subtitle;
      document.getElementById('gen-welcome-desc').textContent = w.desc;
      document.getElementById('gen-welcome-btn').textContent = w.btn;
      document.getElementById('generated-view').style.backgroundImage = `url('${w.bg}')`;

      // Apply optional text color with advanced multi-target parsing
      if (w.color) {
        const input = w.color.toLowerCase();
        const ids = {
          title: 'gen-welcome-title',
          subtitle: 'gen-welcome-subtitle',
          description: 'gen-welcome-desc',
          desc: 'gen-welcome-desc',
          button: 'gen-welcome-btn',
          btn: 'gen-welcome-btn'
        };

        // Split by commas OR the word "and" to handle multiple instructions
        const instructions = input.split(/,| and /);
        let anyTargetFound = false;

        // Reset all to default white first to ensure clean state
        const allIds = ['gen-welcome-title', 'gen-welcome-subtitle', 'gen-welcome-desc', 'gen-welcome-btn'];
        allIds.forEach(id => {
          document.getElementById(id).style.color = (id === 'gen-welcome-btn') ? '' : '#ffffff';
        });

        // Mapping including common typos or shorthand
        const elementMap = {
          title: 'gen-welcome-title',
          tile: 'gen-welcome-title', // Common typo
          subtitle: 'gen-welcome-subtitle',
          sub: 'gen-welcome-subtitle',
          usbtitle: 'gen-welcome-subtitle', // Typo from user
          description: 'gen-welcome-desc',
          desc: 'gen-welcome-desc',
          button: 'gen-welcome-btn',
          btn: 'gen-welcome-btn'
        };

        instructions.forEach(instr => {
          const trimmed = instr.trim();
          if (!trimmed) return;

          const words = trimmed.split(/\s+/);

          Object.keys(elementMap).forEach(key => {
            if (words.some(w => w === key)) {
              // Extract the color (the word immediately following the keyword or the last word)
              // This is more robust for "title red and subtitle orange"
              let color = words[words.length - 1];

              // If the instruction is "title red and ...", the color is likely the word after "title"
              const keyIndex = words.indexOf(key);
              if (words[keyIndex + 1] && !elementMap[words[keyIndex + 1]] && words[keyIndex + 1] !== 'to') {
                color = words[keyIndex + 1];
              } else if (words[keyIndex + 2] && words[keyIndex + 1] === 'to') {
                color = words[keyIndex + 2];
              }

              try {
                document.getElementById(elementMap[key]).style.color = color;
                anyTargetFound = true;
              } catch (e) { }
            }
          });
        });

        // If no specific keyword like "title" or "button" was found,
        // treat the entire input as a single color for everything.
        if (!anyTargetFound) {
          allIds.forEach(id => {
            document.getElementById(id).style.color = w.color;
          });
        }
      } else {
        // Reset to default white if empty
        const els = ['gen-welcome-title', 'gen-welcome-subtitle', 'gen-welcome-desc'];
        els.forEach(id => {
          document.getElementById(id).style.color = '#ffffff';
        });
        document.getElementById('gen-welcome-btn').style.color = '';
      }
    }

    function nextScreen(target) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(`screen-${target}`).classList.add('active');

      if (target === 'nav') {
        document.getElementById('generated-view').style.backgroundImage = `url('${builderData.welcome.bg}')`;
      }
    }

    function goBack() {
      const activeScreen = document.querySelector('.screen.active');
      if (!activeScreen) return;

      const id = activeScreen.id;
      if (id === 'screen-welcome') {
        // Go back to the main portal page (weekly connect)
        window.location.href = 'weekly-connect.html';
        return;
      } else if (id === 'screen-nav') {
        nextScreen('welcome');
      } else if (id === 'screen-quiz-intro') {
        nextScreen('nav');
      } else if (id === 'screen-quiz') {
        if (currentQuiz.index > 0) {
          currentQuiz.index--;
          showCurrentQuestion();
        } else {
          pauseTimer();
          nextScreen('quiz-intro');
        }
      } else if (id === 'screen-completion') {
        nextScreen('nav');
      }
    }

    function startQuiz(type) {
      const data = builderData[type];
      currentQuiz.type = type;
      currentQuiz.contentType = data.contentType || 'text'; // Store content type
      currentQuiz.questions = data.questions;
      currentQuiz.index = 0;

      document.getElementById('generated-view').style.backgroundImage = `url('${data.bg}')`;

      // Update Intro UI
      document.getElementById('quiz-intro-title').textContent = `Welcome to ${data.title}`;

      // Render subtitle — always shown with fallback for both sections
      let subtitleEl = document.getElementById('quiz-intro-subtitle');
      if (!subtitleEl) {
        subtitleEl = document.createElement('p');
        subtitleEl.id = 'quiz-intro-subtitle';
        subtitleEl.style.cssText = 'font-size:1.1rem; opacity:0.85; margin:-30px 0 30px 0; text-align:center; font-weight:500; letter-spacing:0.5px;';
        document.getElementById('quiz-intro-title').insertAdjacentElement('afterend', subtitleEl);
      }

      const cleanSubtitle = (data.subtitle || '').trim();
      subtitleEl.textContent = (cleanSubtitle === 'ghnm,' || cleanSubtitle === '') ? 'Ready for challenge!!' : cleanSubtitle;
      subtitleEl.style.display = 'block';

      const contentBox = document.getElementById('quiz-intro-content');
      if (data.contentType === 'image') {
        contentBox.innerHTML = `<img src="${data.content}" style="max-width: 100%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">`;
      } else {
        const cleanContent = (data.content || '').trim();
        contentBox.textContent = (cleanContent === 'ghnm,' || cleanContent === '') ? 'Ready for challenge!!' : cleanContent;
      }

      nextScreen('quiz-intro');
    }

    function proceedToQuiz() {
      nextScreen('quiz');
      showCurrentQuestion();
    }

    function showCurrentQuestion() {
      const q = currentQuiz.questions[currentQuiz.index];
      const quizText = document.getElementById('quiz-text');
      document.getElementById('quiz-num').textContent = `Question ${currentQuiz.index + 1} of ${currentQuiz.questions.length}`;

      if (currentQuiz.contentType === 'image') {
        quizText.innerHTML = `<img src="${q.q}" style="max-width: 100%; max-height: 300px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">`;
        document.getElementById('answer-text').innerHTML = `<img src="${q.a}" style="max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 10px; display: block; margin-left: auto; margin-right: auto;">`;
      } else {
        quizText.textContent = q.q;
        document.getElementById('answer-text').textContent = q.a;
      }

      document.getElementById('quiz-text').style.display = 'block';
      document.getElementById('answer-box').style.display = 'none';
      document.getElementById('btn-show-answer').style.display = 'block';
      document.getElementById('btn-next-q').style.display = 'none';

      resetTimer();
      startTimer();
    }

    function startTimer() {
      if (currentQuiz.timer) clearInterval(currentQuiz.timer);

      currentQuiz.timer = setInterval(() => {
        currentQuiz.timeLeft--;
        updateTimerUI();
        if (currentQuiz.timeLeft <= 0) {
          clearInterval(currentQuiz.timer);
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(currentQuiz.timer);
      currentQuiz.timer = null;
    }

    function resetTimer() {
      pauseTimer();
      currentQuiz.timeLeft = 20;
      updateTimerUI();
    }

    function updateTimerUI() {
      document.getElementById('timer-text').textContent = currentQuiz.timeLeft;
      const progress = document.getElementById('timer-progress');
      const offset = 283 - (currentQuiz.timeLeft / 20) * 283;
      progress.style.strokeDashoffset = offset;
    }

    function showAnswer() {
      pauseTimer();
      document.getElementById('quiz-text').style.display = 'none';
      document.getElementById('answer-box').style.display = 'block';
      document.getElementById('btn-show-answer').style.display = 'none';
      document.getElementById('btn-next-q').style.display = 'block';
    }

    function nextQuestion() {
      currentQuiz.index++;
      if (currentQuiz.index < currentQuiz.questions.length) {
        showCurrentQuestion();
      } else {
        // Current section finished
        nextScreen('completion');
      }
    }

    function returnToWelcome() {
      document.getElementById('generated-view').style.backgroundImage = `url('${builderData.welcome.bg}')`;
      nextScreen('welcome');
    }

    function restartBuilder() {
      // Takes you back to the admin/builder setup view
      document.getElementById('generated-view').classList.remove('active');
      document.getElementById('builder-view').classList.add('active');
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-welcome').classList.add('active');
    }
  </script>
</body>

</html>
