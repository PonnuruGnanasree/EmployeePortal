<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Gantec Employee Portal</title>
  <meta name="description" content="Login to access the Gantec Employee Portal." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=2" />
  <link rel="stylesheet" href="css/branding.css" />
  <style>
    .portal-marquee {
      position: absolute;
      top: 40px;
      width: 100%;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 4px;
      opacity: 0.8;
      z-index: 10;
    }

    .login-main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 48px 40px;
      text-align: center;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -1px;
      color: var(--text-primary);
    }

    .login-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 40px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: left;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .login-btn {
      margin-top: 12px;
      justify-content: center;
      font-size: 1rem;
      height: 48px;
    }

    .login-footer {
      margin-top: 32px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .login-footer a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>
  <!-- Background orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="portal-marquee">
    <span class="gantec-logo-text">GANTEC <span class="gantec-logo-gradient">Employee Portal</span></span>
  </div>

  <main class="login-main">
    <div class="login-card glass-card">
      <div id="auth-header">
        <h2 class="login-title">Sign In</h2>
        <p class="login-subtitle">Enter your credentials to access the portal</p>
      </div>

      <form class="login-form" id="login-form">
        <div class="form-group" id="name-group" style="display: none;">
          <label class="form-label" for="fullname">Full Name</label>
          <input type="text" id="fullname" class="text-input" placeholder="Enter your name" autocomplete="name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="text-input" placeholder="name@gantecusa.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="text-input" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="password-toggle" id="password-toggle">Show</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary login-btn" id="submit-btn">
          Sign In
        </button>
      </form>

      <div class="login-footer" id="auth-footer">
        Don't have an account? <a href="#" id="toggle-auth">Sign Up</a>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/app.js?v=7"></script>
  <script>
    let isSignUp = false;
    const form = document.getElementById('login-form');
    const toggleLink = document.getElementById('toggle-auth');
    const nameGroup = document.getElementById('name-group');
    const submitBtn = document.getElementById('submit-btn');
    const authHeader = document.getElementById('auth-header');
    const authFooter = document.getElementById('auth-footer');

    function handleToggleAuth(e) {
      if (e) e.preventDefault();
      isSignUp = !isSignUp;
      
      if (isSignUp) {
        authHeader.innerHTML = `
          <h2 class="login-title">Create Account</h2>
          <p class="login-subtitle">Join the Gantec Employee Portal today</p>
        `;
        nameGroup.style.display = 'block';
        document.getElementById('fullname').required = true;
        submitBtn.textContent = 'Create Account';
        authFooter.innerHTML = `Already have an account? <a href="#" id="toggle-auth">Sign In</a>`;
      } else {
        authHeader.innerHTML = `
          <h2 class="login-title">Sign In</h2>
          <p class="login-subtitle">Enter your credentials to access the portal</p>
        `;
        nameGroup.style.display = 'none';
        document.getElementById('fullname').required = false;
        submitBtn.textContent = 'Sign In';
        authFooter.innerHTML = `Don't have an account? <a href="#" id="toggle-auth">Sign Up</a>`;
      }
      
      // Re-bind using the named function
      document.getElementById('toggle-auth').addEventListener('click', handleToggleAuth);
    }

    toggleLink.addEventListener('click', handleToggleAuth);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fullname = document.getElementById('fullname').value;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Custom Email Validation
      if (!email) {
        showToast('Please enter your email address.', 'error');
        return;
      }
      
      if (!email.endsWith('@gantecusa.com')) {
        showToast('Email must be an official @gantecusa.com address.', 'error');
        return;
      }

      // Password Complexity Validation (Match server: just min length)
      if (isSignUp) {
        if (password.length < 8) {
          showToast('Password must be at least 8 characters long.', 'error');
          return;
        }
      }

      // Helper to wait for Supabase client injected by app.js or loaded via CDN
      const getSupabase = () => {
        return new Promise((resolve) => {
          if (window.supabaseClient) return resolve(window.supabaseClient);
          const check = setInterval(() => {
            if (window.supabaseClient) {
              clearInterval(check);
              resolve(window.supabaseClient);
            }
          }, 100);
        });
      };

      try {
        let result;

        if (isSignUp) {
          // 1. Create user in SQLite and Supabase Auth via backend
          const response = await fetch('/api/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullname, email, password })
          });
          result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Signup failed');

          showToast('Account created! Signing in...', 'success');
        }

        // Try to establish Supabase session if client is ready, but don't BLOCK the login
        const supabase = window.supabaseClient;
        if (supabase) {
          await supabase.auth.signInWithPassword({ email, password }).catch(e => console.warn('Supabase session sync skipped:', e.message));
        }

        // 2. Main Login via backend (handles everything: SQLite, Supabase DB sync, and migration)
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error || 'Invalid credentials');
        }

        const loginData = await response.json();
        showToast('Sign in successful!', 'success');

        // Save JWT token for authenticated API requests
        if (loginData.token) {
          localStorage.setItem('gantec_auth_token', loginData.token);
        }

        // Fetch this user's profile image from server before redirect
        try {
          const profileRes = await fetch(`/api/auth/profile?email=${encodeURIComponent(email)}&t=${Date.now()}`, {
            headers: loginData.token ? { 'Authorization': `Bearer ${loginData.token}` } : {}
          });
          const profileData = await profileRes.json();
          if (profileData.success && profileData.user) {
            localStorage.setItem('gantec_user_name', profileData.user.fullname || email.split('@')[0]);
            localStorage.setItem('gantec_user_email', profileData.user.email || email);
            if (profileData.user.profile_image) {
              localStorage.setItem('gantec_user_profile', profileData.user.profile_image);
            }
          }
        } catch (_) {}

        setTimeout(() => {
          window.location.href = 'welcome.html';
        }, 1200);

      } catch (err) {
        showToast(err.message || 'Authentication failed', 'error');
      }
    });

    const passwordToggle = document.getElementById('password-toggle');
    if (passwordToggle) {
      passwordToggle.addEventListener('click', () => {
        const passwordInput = document.getElementById('password');
        const isHidden = passwordInput.type === 'password';
        passwordInput.type = isHidden ? 'text' : 'password';
        passwordToggle.textContent = isHidden ? 'Hide' : 'Show';
      });
    }

    // Clear ALL previous user session data on load to prevent profile bleed between users
    ['gantec_auth', 'gantec_user_name', 'gantec_user_email',
     'gantec_user_profile', 'gantec_user_role'].forEach(k => localStorage.removeItem(k));
  </script>
</body>

</html>
